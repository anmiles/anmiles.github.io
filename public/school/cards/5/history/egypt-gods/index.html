<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Карточки</title>
</head>
<body>
	<div id="root"></div>

	<script type="text/javascript">
		const appSettings = {
			title: 'История 5 класс',
			subtitle: 'Боги Древнего Египта',
			storageKey: 'cards-data-5-history-egypt-gods',
			questionTimeout: 20000,
			maxStringDistance: 5,
			replacements: [
				{ find: 'mood', replace: 'Мут' },
			],
		};
	</script>

	<!-- cspell:disable -->
	<script type="text/cards" id="cards-data">

Анубис: помощник Осириса в царстве мёртвых
Арис: бог плодородия
Атум: бог вечернего солнца
Бастет: богиня радости и любви, покровительница женщин
Исида: богиня семьи и верности, богиня-мать (жена Осириса)
Маат: богиня правды
Осирис: бог природы, земледелия, позже - владыка загробного мира
Ра: бог дневного Солнца (главный бог египтян)
Себек: бог воды и разлива Нила
Сет: бог пустыни и чужеземцев (брат Осириса)
Тот: бог мудрости, счёта и письма
Хапи: бог Нила
Хепри: бог утреннего солнца
Хнум: бог-творец (как гончар лепил людей из глины)
Хонсу: бог Луны (сын Амон-Ра и Мут)
Хор (Гор): бог света (сын Осириса и Исиды)
Шу: бог ветра

	</script>
	<!-- cspell:enable -->

	<link rel="stylesheet" type="text/css" href="../../../style.css" />

	<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
	<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
	<script type="text/javascript" src="/scripts/levenshtein.js?v={VERSION}"></script>

	<script type="text/babel" src="../../../script.js"></script>
	</script>
</body>
</html>
